name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Восстановить зависимости
        run: dotnet restore TempoCue.sln

      - name: Собрать решение
        run: dotnet build TempoCue.sln --configuration Release --no-restore

      - name: Запустить тесты
        run: dotnet test TempoCue.sln --configuration Release --no-build --verbosity normal
